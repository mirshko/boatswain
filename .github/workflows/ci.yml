name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  APP_NAME: Boatswain
  SCHEME: Boatswain
  XCODEPROJ: Boatswain.xcodeproj

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict Boatswain/

  build:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build
        run: |
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Ad-hoc sign
        run: |
          codesign --force --deep --sign - \
            "DerivedData/Build/Products/Release/${{ env.APP_NAME }}.app"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.APP_NAME }}.app
          path: DerivedData/Build/Products/Release/${{ env.APP_NAME }}.app

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ${{ env.APP_NAME }}.app
          path: ${{ env.APP_NAME }}.app
      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ env.APP_NAME }}.app" \
            "${{ runner.temp }}/${{ env.APP_NAME }}.zip"
      - name: Upload to Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ${{ runner.temp }}/${{ env.APP_NAME }}.zip
          generate_release_notes: true
