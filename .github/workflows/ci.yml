name: CI

on:
  push:
  pull_request:
    branches: [main]

env:
  APP_NAME: Boatswain
  SCHEME: Boatswain
  XCODEPROJ: Boatswain.xcodeproj

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Run SwiftLint
        run: swiftlint --strict Boatswain/

  build:
    needs: lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}.app
          path: DerivedData/Build/Products/Release/${{ env.APP_NAME }}.app

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.APP_NAME }}.app
          path: ${{ env.APP_NAME }}.app
      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "${{ env.APP_NAME }}.app/${{ env.APP_NAME }}.app" \
            "${{ runner.temp }}/${{ env.APP_NAME }}.zip"
      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/${{ env.APP_NAME }}.zip
          generate_release_notes: true
